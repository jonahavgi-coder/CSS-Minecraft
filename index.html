<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zombie Frontier: Wave Survival</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #111;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden; font-family: 'Courier New', Courier, monospace;
            color: white; user-select: none;
        }
        canvas {
            background-color: #2b2b2b;
            box-shadow: 0 0 50px rgba(0,0,0,1);
            border: 4px solid #444;
            cursor: crosshair;
        }
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; }
        #wave-display { font-size: 36px; font-weight: bold; color: #ffeb3b; text-shadow: 2px 2px #000; margin-bottom: 5px;}
        #weapon-display { font-size: 20px; color: #00ffff; text-shadow: 1px 1px #000; }
        
        #health-container { position: absolute; bottom: 30px; left: 30px; width: 300px; height: 20px; border: 2px solid #fff; background: #333; }
        #health-bar { width: 100%; height: 100%; background: #ff3333; transition: width 0.1s, background 0.3s; }
        
        #menu {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95); padding: 30px; border: 4px solid #fff; text-align: center;
            pointer-events: auto; min-width: 450px; max-height: 90vh; overflow-y: auto;
        }
        h1 { margin: 0 0 10px 0; font-size: 48px; color: #ff3333; }
        .btn {
            background: #fff; color: #000; border: none; padding: 15px 30px;
            font-size: 24px; font-weight: bold; cursor: pointer; margin-top: 25px;
            transition: 0.2s; width: 100%;
        }
        .btn:hover { background: #ff3333; color: #fff; }

        .menu-select, .menu-input {
            width: 100%; font-size: 18px; padding: 10px; margin-top: 5px;
            background: #222; color: #00ffff; border: 2px solid #555;
            font-family: 'Courier New', Courier, monospace; cursor: pointer;
            box-sizing: border-box;
        }
        .menu-label {
            font-size: 18px; color: #ffeb3b; display: block; text-align: left; margin-top: 15px; font-weight: bold;
        }
        .checkbox-label {
            font-size: 20px; color: #fff; cursor: pointer; display: inline-flex; align-items: center; margin-top: 10px;
        }
        .checkbox-label input { transform: scale(1.5); margin-right: 10px; cursor: pointer; }

        #custom-panel {
            display: none; margin-top: 15px; border: 2px dashed #777; padding: 15px; background: rgba(0,0,0,0.5); text-align: left;
        }

        #message {
            position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%);
            font-size: 40px; font-weight: bold; color: #ffeb3b; text-shadow: 3px 3px #000;
            opacity: 0; transition: opacity 0.3s; pointer-events: none; text-align: center; z-index: 100;
        }
    </style>
</head>
<body>

    <div id="ui" style="display:none;">
        <div id="wave-display">WAVE 1</div>
        <div id="weapon-display">WEAPON: 9mm PISTOL</div>
        <div style="margin-top: 5px; color:#aaa;">ZOMBIES REMAINING: <span id="zombie-count">0</span></div>
    </div>

    <div id="health-container" style="display:none;"><div id="health-bar"></div></div>
    <div id="message">WAVE CLEARED!</div>

    <div id="menu">
        <h1 id="menu-title">ZOMBIE FRONTIER</h1>
        <p id="menu-subtitle" style="margin-bottom:5px;">WASD to Move | Mouse to Aim | Click to Shoot</p>
        
        <label class="checkbox-label" style="color: #FFD700; font-weight: bold;">
            <input type="checkbox" id="god-mode-check"> ENABLE GOD MODE (Invincibility)
        </label>

        <label class="menu-label">GAME MODE:</label>
        <select id="mode-select" class="menu-select">
            <option value="normal">Normal (Constant Stats, High Swarm)</option>
            <option value="realism">Realism (Big Zombies spawn every 10 waves)</option>
            <option value="simulator">Simulator (Stats scale every wave)</option>
            <option value="custom">Custom (Make your own wave)</option>
        </select>

        <div id="custom-panel">
            <label class="menu-label" style="margin-top:0;">Zombie Count:</label>
            <input type="number" id="custom-count" class="menu-input" value="100">
            <label class="menu-label">Zombie Speed (Default 1.5):</label>
            <input type="number" id="custom-speed" class="menu-input" value="2.5" step="0.5">
            <label class="checkbox-label">
                <input type="checkbox" id="custom-big"> Include Big Zombies
            </label>
        </div>

        <label class="menu-label">STARTING WAVE:</label>
        <select id="wave-select" class="menu-select"></select>

        <label class="menu-label">CHOOSE YOUR LOADOUT:</label>
        <select id="weapon-select" class="menu-select"></select>

        <button class="btn" id="start-btn" onclick="startGame()">START SURVIVAL</button>
    </div>

    <canvas id="gameCanvas" width="1000" height="700"></canvas>

    <script>
        // --- MATH HELPERS FOR BEAM COLLISION ---
        function sqr(x) { return x * x; }
        function dist2(v, w) { return sqr(v.x - w.x) + sqr(v.y - w.y); }
        function distToSegmentSquared(p, v, w) {
            let l2 = dist2(v, w);
            if (l2 === 0) return dist2(p, v);
            let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            return dist2(p, { x: v.x + t * (w.x - v.x), y: v.y + t * (w.y - v.y) });
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menu = document.getElementById('menu');
        const ui = document.getElementById('ui');
        const hpBar = document.getElementById('health-bar');
        const hpContainer = document.getElementById('health-container');
        const waveDisplay = document.getElementById('wave-display');
        const weaponDisplay = document.getElementById('weapon-display');
        const zombieCountDisplay = document.getElementById('zombie-count');
        const msgDisplay = document.getElementById('message');
        const weaponSelect = document.getElementById('weapon-select');
        const waveSelect = document.getElementById('wave-select');
        const modeSelect = document.getElementById('mode-select');
        const customPanel = document.getElementById('custom-panel');
        const godModeCheck = document.getElementById('god-mode-check');
        
        // Show/Hide Custom Panel
        modeSelect.addEventListener('change', (e) => {
            customPanel.style.display = (e.target.value === 'custom') ? 'block' : 'none';
        });

        // --- GAME STATE ---
        let gameState = 'MENU';
        let wave = 1;
        const MAX_WAVES = 55;
        let isGodMode = false;
        let gameMode = 'normal';
        let keys = {};
        let mouse = { x: canvas.width/2, y: canvas.height/2, down: false };
        let screenShake = 0;

        let zombies = [];
        let bullets = [];
        let grenades = [];
        let beams = [];
        let particles = [];
        let bloodStains = [];

        const BORDER_SIZE = 10;

        // --- WEAPON TIERS ---
        const WEAPONS = [
            { name: "1. 9mm PISTOL", dmg: 25, fireRate: 15, spread: 0.05, bullets: 1, speed: 12, color: '#ffff00', length: 20 },
            { name: "2. REVOLVER", dmg: 45, fireRate: 25, spread: 0.02, bullets: 1, speed: 15, color: '#ffcc00', length: 22 },
            { name: "3. DUAL PISTOLS", dmg: 20, fireRate: 8, spread: 0.08, bullets: 1, speed: 12, color: '#ffff55', length: 20 },
            { name: "4. MAC-10 SMG", dmg: 15, fireRate: 5, spread: 0.15, bullets: 1, speed: 14, color: '#dddddd', length: 24 },
            { name: "5. PUMP SHOTGUN", dmg: 18, fireRate: 40, spread: 0.25, bullets: 6, speed: 10, color: '#ffaa00', length: 25 },
            { name: "6. COMBAT SHOTGUN", dmg: 15, fireRate: 25, spread: 0.2, bullets: 8, speed: 12, color: '#ff8800', length: 26 },
            { name: "7. ASSAULT RIFLE", dmg: 30, fireRate: 6, spread: 0.08, bullets: 1, speed: 16, color: '#ffffaa', length: 30 },
            { name: "8. HEAVY RIFLE", dmg: 45, fireRate: 8, spread: 0.05, bullets: 1, speed: 18, color: '#ffddaa', length: 32 },
            { name: "9. LIGHT MACHINE GUN", dmg: 25, fireRate: 4, spread: 0.18, bullets: 1, speed: 15, color: '#cccccc', length: 35 },
            { name: "10. MARKSMAN RIFLE", dmg: 100, fireRate: 35, spread: 0.01, bullets: 1, speed: 25, color: '#ffffff', length: 38 },
            { name: "11. AUTO SHOTGUN", dmg: 18, fireRate: 10, spread: 0.25, bullets: 5, speed: 12, color: '#ff6600', length: 28 },
            { name: "12. LASER CARBINE", dmg: 40, fireRate: 5, spread: 0.02, bullets: 1, speed: 22, color: '#00ff00', length: 30 },
            { name: "13. PLASMA RIFLE", dmg: 55, fireRate: 6, spread: 0.05, bullets: 1, speed: 18, color: '#00ffff', length: 32 },
            { name: "14. PLASMA MINIGUN", dmg: 50, fireRate: 2, spread: 0.15, bullets: 2, speed: 18, color: '#00ccff', length: 35 },
            { name: "15. RAILGUN", dmg: 250, fireRate: 30, spread: 0, bullets: 1, speed: 35, color: '#ff00ff', length: 45 },
            { name: "16. THE OBLITERATOR (LEGENDARY)", dmg: 1000, fireRate: 2, spread: 0.4, bullets: 12, speed: 25, color: '#ffffff', length: 40 },
            { name: "17. GRENADE LAUNCHER (LEGENDARY)", dmg: 600, fireRate: 40, spread: 0, bullets: 1, speed: 15, color: '#ff4400', length: 30, type: 'grenade' },
            { name: "18. THE GOD WEAPON (MYTHIC)", dmg: 99999, fireRate: 20, spread: 0, bullets: 1, speed: 0, color: '#ffffff', length: 40, type: 'beam' }
        ];

        // Populate Dropdowns
        WEAPONS.forEach((w, index) => {
            let opt = document.createElement('option');
            opt.value = index;
            opt.innerHTML = w.name;
            weaponSelect.appendChild(opt);
        });

        const waveOptions = [1, 10, 20, 30, 40, 50, 55];
        waveOptions.forEach(w => {
            let opt = document.createElement('option');
            opt.value = w;
            opt.innerHTML = `Wave ${w}`;
            waveSelect.appendChild(opt);
        });

        // --- GLOBAL LOGIC HELPERS ---
        let waveSpawnsRemaining = 0;
        let bigZombiesRemaining = 0;
        let spawnTimer = 0;
        let isWaveActive = false;

        function updateZombieCount() {
            zombieCountDisplay.innerText = waveSpawnsRemaining + bigZombiesRemaining + zombies.length;
        }

        function killZombie(z, index) {
            let pCount = z.isBig ? 20 : 8;
            let pSize = z.isBig ? 7 : 5;
            for(let k=0; k<pCount; k++) particles.push(new Particle(z.x, z.y, '#8a0303', pSize));
            
            bloodStains.push({ x: z.x, y: z.y, r: z.isBig ? 35 : (Math.random()*15 + 10) });
            zombies.splice(index, 1);
            updateZombieCount();
        }

        // --- CLASSES ---
        class Player {
            constructor() {
                this.x = canvas.width / 2; this.y = canvas.height / 2;
                this.radius = 15;
                this.speed = 4;
                this.hp = 100; this.maxHp = 100;
                this.aimAngle = 0;
                
                this.weaponIndex = parseInt(weaponSelect.value);
                this.weapon = WEAPONS[this.weaponIndex];
                this.shootCooldown = 0;
            }

            takeDamage(amount) {
                screenShake = 5;
                for(let i=0; i<5; i++) particles.push(new Particle(this.x, this.y, '#ff0000', 4));

                if (!isGodMode) {
                    this.hp -= amount;
                    hpBar.style.width = Math.max(0, (this.hp / this.maxHp) * 100) + '%';
                    if (this.hp <= 0) gameOver();
                }
            }

            update() {
                let vx = 0; let vy = 0;
                if (keys['KeyW']) vy -= this.speed;
                if (keys['KeyS']) vy += this.speed;
                if (keys['KeyA']) vx -= this.speed;
                if (keys['KeyD']) vx += this.speed;

                if (vx !== 0 && vy !== 0) {
                    const norm = Math.sqrt(vx*vx + vy*vy);
                    vx = (vx / norm) * this.speed;
                    vy = (vy / norm) * this.speed;
                }
                
                this.x += vx; this.y += vy;
                this.aimAngle = Math.atan2(mouse.y - this.y, mouse.x - this.x);

                if (this.shootCooldown > 0) this.shootCooldown--;
                if (mouse.down && this.shootCooldown <= 0) {
                    this.shoot();
                }
            }

            checkBounds() {
                const boundLimit = BORDER_SIZE + this.radius;
                if (this.x < boundLimit) this.x = boundLimit;
                if (this.x > canvas.width - boundLimit) this.x = canvas.width - boundLimit;
                if (this.y < boundLimit) this.y = boundLimit;
                if (this.y > canvas.height - boundLimit) this.y = canvas.height - boundLimit;
            }

            shoot() {
                this.shootCooldown = this.weapon.fireRate;
                screenShake = this.weapon.bullets > 2 ? 6 : 2; 

                let barrelX = this.x + Math.cos(this.aimAngle)*this.weapon.length;
                let barrelY = this.y + Math.sin(this.aimAngle)*this.weapon.length;

                if (this.weapon.type === 'grenade') {
                    grenades.push(new Grenade(barrelX, barrelY, mouse.x, mouse.y, this.weapon));
                } 
                else if (this.weapon.type === 'beam') {
                    screenShake = 25;
                    beams.push(new Beam(barrelX, barrelY, this.aimAngle));
                    
                    let endX = barrelX + Math.cos(this.aimAngle) * 3000;
                    let endY = barrelY + Math.sin(this.aimAngle) * 3000;
                    
                    for (let i = zombies.length - 1; i >= 0; i--) {
                        let z = zombies[i];
                        let distSq = distToSegmentSquared({x: z.x, y: z.y}, {x: barrelX, y: barrelY}, {x: endX, y: endY});
                        if (distSq <= Math.pow(250 + z.radius, 2)) { // 250 is half the width of the god beam
                            z.hp -= this.weapon.dmg;
                            if (z.hp <= 0) killZombie(z, i);
                        }
                    }
                } 
                else {
                    for (let i = 0; i < this.weapon.bullets; i++) {
                        let spreadAngle = this.aimAngle + (Math.random() - 0.5) * this.weapon.spread;
                        bullets.push(new Bullet(barrelX, barrelY, spreadAngle, this.weapon));
                    }
                }
                
                particles.push(new Particle(barrelX + Math.cos(this.aimAngle)*5, barrelY + Math.sin(this.aimAngle)*5, this.weapon.color, 8, 0.4));
            }

            draw() {
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.aimAngle);
                
                ctx.fillStyle = '#777';
                ctx.fillRect(0, -4, this.weapon.length, 8);
                
                ctx.fillStyle = isGodMode ? '#FFD700' : '#4CAF50'; 
                ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI*2); ctx.fill();
                
                ctx.fillStyle = isGodMode ? '#DAA520' : '#2E7D32'; 
                ctx.beginPath(); ctx.arc(0, 0, this.radius * 0.6, 0, Math.PI*2); ctx.fill();
                
                ctx.restore();
            }
        }

        class Zombie {
            constructor(waveMult, isBig = false) {
                if (Math.random() < 0.5) {
                    this.x = Math.random() < 0.5 ? -30 : canvas.width + 30;
                    this.y = Math.random() * canvas.height;
                } else {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() < 0.5 ? -30 : canvas.height + 30;
                }

                this.isBig = isBig;
                this.radius = isBig ? 30 : 14;
                
                if (gameMode === 'normal') {
                    this.maxHp = isBig ? 300 : 40;
                    this.speed = 1.0 + (Math.random() * 0.8);
                } else if (gameMode === 'realism') {
                    this.maxHp = isBig ? 200 + (waveMult * 10) : 40;
                    let spdMult = 1.0 + Math.min(waveMult / 55, 1.0); // max 2x speed
                    this.speed = (1.0 + Math.random() * 0.8) * spdMult;
                } else if (gameMode === 'simulator') {
                    this.maxHp = (isBig ? 200 : 40) + (waveMult * 15);
                    this.speed = 1.0 + (Math.random() * 0.8) + (waveMult * 0.1);
                } else if (gameMode === 'custom') {
                    let customSpd = parseFloat(document.getElementById('custom-speed').value) || 2.0;
                    this.maxHp = isBig ? 400 : 40;
                    this.speed = customSpd + (Math.random() * customSpd * 0.3 - customSpd * 0.15);
                }

                this.hp = this.maxHp;
                this.damage = isBig ? 35 : 10 + (waveMult * 2);
                
                if (isBig) {
                    this.color = '#8B0000'; // Dark blood red
                } else {
                    this.color = `rgb(${Math.min(255, 50 + waveMult*5)}, ${Math.max(0, 100 - waveMult*2)}, 50)`;
                }
                
                this.vx = 0; this.vy = 0;
            }

            update(index) {
                const angle = Math.atan2(player.y - this.y, player.x - this.x);
                this.vx = Math.cos(angle) * this.speed;
                this.vy = Math.sin(angle) * this.speed;

                for (let j = 0; j < zombies.length; j++) {
                    if (index === j) continue;
                    let other = zombies[j];
                    let dx = this.x - other.x; let dy = this.y - other.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < this.radius + other.radius) {
                        this.vx += (dx / dist) * 0.5;
                        this.vy += (dy / dist) * 0.5;
                    }
                }

                this.x += this.vx; this.y += this.vy;

                const distToPlayer = Math.hypot(player.x - this.x, player.y - this.y);
                if (distToPlayer < this.radius + player.radius) {
                    player.takeDamage(this.damage);
                    player.x += Math.cos(angle) * (this.isBig ? 20 : 10); 
                    player.y += Math.sin(angle) * (this.isBig ? 20 : 10);
                    this.x -= Math.cos(angle) * 30; this.y -= Math.sin(angle) * 30;
                }
            }

            draw() {
                const angle = Math.atan2(player.y - this.y, player.x - this.x);
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(angle);

                ctx.fillStyle = this.color;
                let reach = this.isBig ? 25 : 20;
                let thick = this.isBig ? 10 : 6;
                ctx.fillRect(0, -this.radius*0.8, reach, thick); 
                ctx.fillRect(0, this.radius*0.8 - thick, reach, thick);  

                ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#222'; ctx.lineWidth = this.isBig ? 4 : 2; ctx.stroke();

                if (this.hp < this.maxHp) {
                    ctx.rotate(-angle); 
                    ctx.fillStyle = 'red'; ctx.fillRect(-15, -this.radius-10, 30, 5);
                    ctx.fillStyle = '#00ff00'; ctx.fillRect(-15, -this.radius-10, 30 * (this.hp/this.maxHp), 5);
                }

                ctx.restore();
            }
        }

        class Bullet {
            constructor(x, y, angle, weapon) {
                this.x = x; this.y = y;
                this.vx = Math.cos(angle) * weapon.speed;
                this.vy = Math.sin(angle) * weapon.speed;
                this.dmg = weapon.dmg;
                this.color = weapon.color;
            }
            update(index) {
                this.x += this.vx; this.y += this.vy;
                
                ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, 3, 0, Math.PI*2); ctx.fill();

                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    bullets.splice(index, 1); return;
                }

                for (let i = 0; i < zombies.length; i++) {
                    let z = zombies[i];
                    if (Math.hypot(this.x - z.x, this.y - z.y) < z.radius + 3) {
                        z.hp -= this.dmg;
                        for(let k=0; k<2; k++) particles.push(new Particle(this.x, this.y, '#8a0303', 3));

                        if (z.hp <= 0) killZombie(z, i);
                        
                        if (this.dmg < 200) { bullets.splice(index, 1); }
                        break;
                    }
                }
            }
        }

        class Grenade {
            constructor(x, y, tx, ty, weapon) {
                this.x = x; this.y = y;
                const angle = Math.atan2(ty - y, tx - x);
                this.speed = weapon.speed;
                this.vx = Math.cos(angle) * this.speed;
                this.vy = Math.sin(angle) * this.speed;
                this.tx = tx; this.ty = ty;
                this.dmg = weapon.dmg;
            }
            update(index) {
                this.x += this.vx; this.y += this.vy;
                ctx.fillStyle = '#ffaa00';
                ctx.beginPath(); ctx.arc(this.x, this.y, 6, 0, Math.PI*2); ctx.fill();
                
                // Explode upon reaching target
                if (Math.hypot(this.tx - this.x, this.ty - this.y) <= this.speed * 1.5) {
                    screenShake = 20;
                    for(let k=0; k<30; k++) particles.push(new Particle(this.x, this.y, '#ff4400', 10, 0.04));
                    for(let k=0; k<15; k++) particles.push(new Particle(this.x, this.y, '#ffff00', 6, 0.08));
                    
                    for (let i = zombies.length - 1; i >= 0; i--) {
                        let z = zombies[i];
                        if (Math.hypot(this.x - z.x, this.y - z.y) < 180 + z.radius) { // Big explosion radius
                            z.hp -= this.dmg;
                            if (z.hp <= 0) killZombie(z, i);
                        }
                    }
                    grenades.splice(index, 1);
                }
            }
        }

        class Beam {
            constructor(x, y, angle) {
                this.x = x; this.y = y; this.angle = angle;
                this.life = 1.0;
                this.endX = this.x + Math.cos(this.angle) * 3000;
                this.endY = this.y + Math.sin(this.angle) * 3000;
            }
            update(index) {
                this.life -= 0.05; // Fades out over 20 frames
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                
                // Massive outer glow
                ctx.strokeStyle = "rgba(0, 255, 255, 0.5)";
                ctx.lineWidth = 500; 
                ctx.lineCap = "round";
                ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(this.endX, this.endY); ctx.stroke();
                
                // Inner pure light core
                ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
                ctx.lineWidth = 300;
                ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(this.endX, this.endY); ctx.stroke();
                
                ctx.restore();
                
                if (this.life <= 0) beams.splice(index, 1);
            }
        }

        class Particle {
            constructor(x, y, color, size, lifeDecay = 0.05) {
                this.x = x; this.y = y;
                this.vx = (Math.random() - 0.5) * 10; this.vy = (Math.random() - 0.5) * 10;
                this.color = color; this.size = size;
                this.life = 1.0; this.lifeDecay = lifeDecay;
            }
            update(index) {
                this.x += this.vx; this.y += this.vy;
                this.vx *= 0.9; this.vy *= 0.9; 
                this.life -= this.lifeDecay;
                
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
                ctx.globalAlpha = 1.0;

                if (this.life <= 0) particles.splice(index, 1);
            }
        }

        // --- INPUTS ---
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);
        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left; mouse.y = e.clientY - rect.top;
        });
        canvas.addEventListener('mousedown', () => mouse.down = true);
        canvas.addEventListener('mouseup', () => mouse.down = false);

        // --- CORE LOGIC ---
        window.startGame = function() {
            // Apply settings from UI
            gameMode = modeSelect.value;
            isGodMode = godModeCheck.checked;
            wave = parseInt(waveSelect.value); 
            
            player = new Player();
            zombies = []; bullets = []; grenades = []; beams = []; particles = []; bloodStains = [];
            
            gameState = 'PLAYING';
            menu.style.display = 'none';
            ui.style.display = 'block';
            hpContainer.style.display = 'block';
            
            if (isGodMode) {
                hpBar.style.background = '#ffeb3b'; // Gold health bar
                hpBar.style.width = '100%';
            } else {
                hpBar.style.background = '#ff3333'; // Red health bar
                hpBar.style.width = '100%';
            }
            
            startWave();
        }

        function startWave() {
            isWaveActive = true;
            let titleText = isGodMode ? " (GOD MODE)" : "";
            waveDisplay.innerText = `WAVE ${wave}${titleText}`;
            
            if (gameMode === 'custom') {
                waveSpawnsRemaining = parseInt(document.getElementById('custom-count').value) || 50;
                bigZombiesRemaining = document.getElementById('custom-big').checked ? Math.max(1, Math.floor(waveSpawnsRemaining/10)) : 0;
            } else if (gameMode === 'realism') {
                if (wave >= 55) {
                    waveSpawnsRemaining = 250;
                    bigZombiesRemaining = 5;
                } else {
                    waveSpawnsRemaining = 10 + (wave * 5);
                    bigZombiesRemaining = (wave % 10 === 0) ? Math.floor(wave / 10) : 0;
                }
            } else { // Normal & Simulator 
                waveSpawnsRemaining = 10 + (wave * 5); 
                bigZombiesRemaining = 0;
            }

            updateZombieCount();
            showCenterMessage(`WAVE ${wave} START`);

            weaponDisplay.innerText = `WEAPON: ${player.weapon.name.split('. ')[1]}`;
            
            if (!isGodMode) {
                player.hp = player.maxHp;
                hpBar.style.width = '100%';
            }
        }

        function showCenterMessage(text) {
            msgDisplay.innerText = text;
            msgDisplay.style.opacity = 1;
            setTimeout(() => msgDisplay.style.opacity = 0, 2500);
        }

        function checkWaveEnd() {
            if (waveSpawnsRemaining <= 0 && bigZombiesRemaining <= 0 && zombies.length === 0 && isWaveActive) {
                isWaveActive = false;
                
                if (wave >= MAX_WAVES && gameMode !== 'custom') {
                    showCenterMessage("INFECTION CLEARED!");
                    setTimeout(gameWon, 3000);
                    return;
                }

                showCenterMessage("WAVE CLEARED");
                setTimeout(() => {
                    wave++;
                    startWave();
                }, 3000); 
            }
        }

        function gameWon() {
            gameState = 'GAMEOVER';
            menu.style.display = 'block';
            document.getElementById('menu-title').innerText = "VICTORY!";
            document.getElementById('menu-title').style.color = "#00ff00";
            document.getElementById('menu-subtitle').innerText = `You Survived all ${MAX_WAVES} Waves.`;
            document.getElementById('start-btn').innerText = "PLAY AGAIN";
            ui.style.display = 'none';
            hpContainer.style.display = 'none';
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            menu.style.display = 'block';
            document.getElementById('menu-title').innerText = "YOU DIED";
            document.getElementById('menu-title').style.color = "#ff3333";
            document.getElementById('menu-subtitle').innerText = `Survived to Wave ${wave}`;
            document.getElementById('start-btn').innerText = "TRY AGAIN";
            ui.style.display = 'none';
            hpContainer.style.display = 'none';
        }

        // --- GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            if (gameState !== 'PLAYING') return;

            ctx.fillStyle = '#2b2b2b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Boundary
            ctx.strokeStyle = '#ffeb3b';
            ctx.lineWidth = BORDER_SIZE;
            ctx.setLineDash([20, 20]);
            ctx.strokeRect(BORDER_SIZE/2, BORDER_SIZE/2, canvas.width - BORDER_SIZE, canvas.height - BORDER_SIZE);
            ctx.setLineDash([]); 
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.strokeRect(BORDER_SIZE, BORDER_SIZE, canvas.width - BORDER_SIZE * 2, canvas.height - BORDER_SIZE * 2);

            ctx.save();
            if (screenShake > 0) {
                ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
                screenShake *= 0.8;
                if (screenShake < 0.5) screenShake = 0;
            }

            ctx.fillStyle = 'rgba(100, 0, 0, 0.4)';
            bloodStains.forEach(b => {
                ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
            });

            // Spawning Logic
            if ((waveSpawnsRemaining > 0 || bigZombiesRemaining > 0) && isWaveActive) {
                spawnTimer--;
                if (spawnTimer <= 0) {
                    let spawnBig = false;
                    if (bigZombiesRemaining > 0 && (Math.random() < 0.1 || waveSpawnsRemaining <= 0)) {
                        spawnBig = true;
                        bigZombiesRemaining--;
                    } else if (waveSpawnsRemaining > 0) {
                        waveSpawnsRemaining--;
                    }
                    
                    zombies.push(new Zombie(wave, spawnBig));
                    updateZombieCount();
                    spawnTimer = Math.max(3, 60 - (wave * 3)); 
                }
            }

            player.update();
            zombies.forEach((z, i) => { z.update(i); z.draw(); });
            player.checkBounds(); 
            player.draw();

            for (let i = grenades.length - 1; i >= 0; i--) grenades[i].update(i);
            for (let i = bullets.length - 1; i >= 0; i--) bullets[i].update(i);
            for (let i = beams.length - 1; i >= 0; i--) beams[i].update(i);
            for (let i = particles.length - 1; i >= 0; i--) particles[i].update(i);

            checkWaveEnd();
            ctx.restore();
        }

        animate();
    </script>
</body>
</html>
